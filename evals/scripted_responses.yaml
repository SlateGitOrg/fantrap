# Recorded model attempts, keyed by question id. Attempt 1 is the first reply; later attempts
# answer the guard's feedback. Past the end of a list the last attempt is returned again.

# Identical to the gold query after normalization.
q01:
  - "select r.name as region, count(*) as customers   from customers c join regions r on r.region_id = c.region_id\n   group by r.name order by r.name;"
q02:
  - "SELECT SUM(amount)   AS total_invoiced FROM invoices\nWHERE invoice_date >= DATE '2025-01-01' AND invoice_date < DATE '2026-01-01';"

# Correct answers written differently from gold.
q03:
  - |-
    WITH paid AS (
      SELECT invoice_id, SUM(amount) AS received FROM payments GROUP BY invoice_id
    ), billed AS (
      SELECT i.invoice_id, c.region_id, i.amount
      FROM invoices i JOIN customers c ON c.customer_id = i.customer_id
    )
    SELECT SUM(b.amount - COALESCE(paid.received, 0)) AS balance, reg.name AS region_name
    FROM billed b
    LEFT JOIN paid ON paid.invoice_id = b.invoice_id
    JOIN regions reg ON reg.region_id = b.region_id
    GROUP BY reg.name
    ORDER BY reg.name
q04:
  - |-
    WITH balances AS (
      SELECT i.customer_id, i.amount - COALESCE(p.paid, 0) AS balance
      FROM invoices AS i
      LEFT JOIN (SELECT invoice_id, SUM(amount) AS paid FROM payments GROUP BY 1) AS p
        USING (invoice_id)
      WHERE i.due_date < '2025-12-31'
    )
    SELECT SUM(b.balance) AS open_balance, c.segment AS customer_segment
    FROM balances b
    INNER JOIN customers c ON b.customer_id = c.customer_id
    GROUP BY c.segment
    ORDER BY customer_segment
q05:
  - |-
    SELECT SUM(amount) AS total, EXTRACT(QUARTER FROM invoice_date) AS q
    FROM invoices
    WHERE EXTRACT(YEAR FROM invoice_date) = 2025
    GROUP BY q
    ORDER BY q
q06:
  - |-
    SELECT customer_name, total
    FROM (
      SELECT c.name AS customer_name, SUM(i.amount) AS total,
             ROW_NUMBER() OVER (ORDER BY SUM(i.amount) DESC) AS rn
      FROM customers c
      JOIN invoices i ON i.customer_id = c.customer_id
      WHERE i.invoice_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
      GROUP BY c.customer_id, c.name
    ) ranked
    WHERE rn <= 5
    ORDER BY total DESC
q07:
  - |-
    SELECT SUM(amount) AS received, DATE_TRUNC('month', payment_date) AS m
    FROM payments
    WHERE payment_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
    GROUP BY m
    ORDER BY m
q08:
  - |-
    WITH multi AS (SELECT invoice_id, COUNT(*) AS n FROM shipments GROUP BY invoice_id)
    SELECT COUNT(invoice_id) FROM multi WHERE n >= 2
q09:
  - |-
    SELECT SUM(cn.amount) AS total_credits
    FROM credit_notes AS cn
    WHERE cn.issued_date BETWEEN '2025-01-01' AND '2025-12-31'
q10:
  - |-
    SELECT AVG(amount) AS mean_amount, segment
    FROM (SELECT i.amount, c.segment FROM invoices i JOIN customers c USING (customer_id))
    GROUP BY segment
    ORDER BY segment
q11:
  - |-
    SELECT region, SUM(freight_cost) AS total_freight
    FROM (
      SELECT r.name AS region, s.freight_cost
      FROM regions r
      JOIN customers c ON c.region_id = r.region_id
      JOIN invoices i ON i.customer_id = c.customer_id
      JOIN shipments s ON s.invoice_id = i.invoice_id
    ) AS x
    GROUP BY region
    ORDER BY region
q12:
  - |-
    SELECT COUNT(*)
    FROM customers
    WHERE customer_id NOT IN (
      SELECT customer_id FROM invoices WHERE invoice_date >= '2025-10-01'
    )
q13:
  - |-
    SELECT COUNT(*)
    FROM invoices
    WHERE amount - 0.005 <= (SELECT SUM(amount) FROM payments WHERE payments.invoice_id = invoices.invoice_id)
q14:
  - |-
    SELECT AVG(DATE_DIFF('day', i.invoice_date, p.payment_date)) AS days_to_pay
    FROM invoices i
    INNER JOIN payments p ON p.invoice_id = i.invoice_id
q15:
  - |-
    SELECT COUNT(i.invoice_id) AS n, r.name
    FROM regions r
    JOIN customers c ON c.region_id = r.region_id
    JOIN invoices i ON i.customer_id = c.customer_id
    WHERE i.invoice_date BETWEEN '2025-07-01' AND '2025-12-31'
    GROUP BY r.name
    ORDER BY r.name
q16:
  - |-
    WITH by_customer AS (
      SELECT customer_id, MAX(amount) AS top FROM invoices GROUP BY customer_id
    )
    SELECT MAX(bc.top) AS largest_invoice, r.name
    FROM by_customer bc
    JOIN customers c ON c.customer_id = bc.customer_id
    JOIN regions r ON r.region_id = c.region_id
    GROUP BY r.name
    ORDER BY r.name
q17:
  - |-
    SELECT m, SUM(units) AS total_units
    FROM (
      SELECT DATE_TRUNC('month', ship_date) AS m, units
      FROM shipments
      WHERE ship_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
    ) t
    GROUP BY m
    ORDER BY m
q18:
  - |-
    SELECT SUM(pay.amount) AS total_received, cust.segment AS seg
    FROM customers cust
    JOIN invoices inv ON inv.customer_id = cust.customer_id
    JOIN payments pay ON pay.invoice_id = inv.invoice_id
    WHERE YEAR(pay.payment_date) = 2025
    GROUP BY cust.segment
    ORDER BY seg
q19:
  - |-
    SELECT r.name, SUM(x.amount) AS credited
    FROM (
      SELECT n.amount, i.customer_id
      FROM credit_notes n JOIN invoices i ON i.invoice_id = n.invoice_id
    ) x
    JOIN customers c ON c.customer_id = x.customer_id
    JOIN regions r ON r.region_id = c.region_id
    GROUP BY r.name
    ORDER BY r.name
q20:
  - |-
    SELECT SUM(i.amount) AS total, r.name
    FROM regions r
    JOIN customers c ON c.region_id = r.region_id
    JOIN invoices i ON i.customer_id = c.customer_id
    WHERE EXTRACT(YEAR FROM i.invoice_date) = 2025
      AND i.invoice_id NOT IN (SELECT invoice_id FROM credit_notes)
    GROUP BY r.name
    ORDER BY r.name
q21:
  - |-
    SELECT AVG(p.salary) AS average, p.department AS dept
    FROM payroll AS p
    GROUP BY p.department
    ORDER BY p.department
q22:
  - |-
    SELECT COUNT(p.employee_id) AS n, r.name
    FROM regions r
    JOIN payroll p ON p.region_id = r.region_id
    GROUP BY r.name
    ORDER BY r.name

# Fan traps: the first attempt joins a one-to-many table and sums the invoice amount.
q23:
  - |-
    SELECT r.name AS region, SUM(i.amount) AS invoiced
    FROM invoices i
    JOIN shipments s ON s.invoice_id = i.invoice_id
    JOIN customers c ON c.customer_id = i.customer_id
    JOIN regions r ON r.region_id = c.region_id
    WHERE i.invoice_date >= DATE '2025-01-01' AND i.invoice_date < DATE '2026-01-01'
    GROUP BY r.name
    ORDER BY r.name
  - |-
    SELECT r.name AS region, SUM(i.amount) AS invoiced
    FROM invoices i
    JOIN (SELECT invoice_id, COUNT(*) AS shipment_count FROM shipments GROUP BY invoice_id) s
      ON s.invoice_id = i.invoice_id
    JOIN customers c ON c.customer_id = i.customer_id
    JOIN regions r ON r.region_id = c.region_id
    WHERE i.invoice_date >= DATE '2025-01-01' AND i.invoice_date < DATE '2026-01-01'
    GROUP BY r.name
    ORDER BY r.name
q24:
  - |-
    SELECT c.segment, SUM(i.amount) AS invoiced
    FROM invoices i
    JOIN payments p ON p.invoice_id = i.invoice_id
    JOIN customers c ON c.customer_id = i.customer_id
    WHERE i.invoice_date >= DATE '2024-01-01' AND i.invoice_date < DATE '2025-01-01'
    GROUP BY c.segment
    ORDER BY c.segment
  - |-
    WITH paid_invoices AS (SELECT DISTINCT invoice_id FROM payments)
    SELECT c.segment, SUM(i.amount) AS invoiced
    FROM invoices i
    JOIN paid_invoices pi ON pi.invoice_id = i.invoice_id
    JOIN customers c ON c.customer_id = i.customer_id
    WHERE i.invoice_date >= DATE '2024-01-01' AND i.invoice_date < DATE '2025-01-01'
    GROUP BY c.segment
    ORDER BY c.segment
q25:
