    SELECT COUNT(*) AS shipped_invoices
    FROM invoices i
    JOIN shipments s ON s.invoice_id = i.invoice_id
    WHERE i.invoice_date >= DATE '2025-01-01' AND i.invoice_date < DATE '2026-01-01'
  - |-
    SELECT COUNT(DISTINCT i.invoice_id) AS shipped_invoices
    FROM invoices i
    JOIN shipments s ON s.invoice_id = i.invoice_id
    WHERE i.invoice_date >= DATE '2025-01-01' AND i.invoice_date < DATE '2026-01-01'
q26:
  - |-
    SELECT r.name AS region, SUM(i.amount) AS invoiced, SUM(s.freight_cost) AS freight
    FROM invoices i
    JOIN shipments s ON s.invoice_id = i.invoice_id
    JOIN customers c ON c.customer_id = i.customer_id
    JOIN regions r ON r.region_id = c.region_id
    WHERE i.invoice_date >= DATE '2025-01-01' AND i.invoice_date < DATE '2026-01-01'
    GROUP BY r.name
    ORDER BY r.name
  - |-
    WITH freight AS (
      SELECT invoice_id, SUM(freight_cost) AS freight_cost FROM shipments GROUP BY invoice_id
    )
    SELECT r.name AS region, SUM(i.amount) AS invoiced, SUM(f.freight_cost) AS freight
    FROM invoices i
    LEFT JOIN freight f ON f.invoice_id = i.invoice_id
    JOIN customers c ON c.customer_id = i.customer_id
    JOIN regions r ON r.region_id = c.region_id
    WHERE i.invoice_date >= DATE '2025-01-01' AND i.invoice_date < DATE '2026-01-01'
    GROUP BY r.name
    ORDER BY r.name
q27:
  - |-
    SELECT SUM(i.amount) AS invoiced
    FROM invoices i
    JOIN shipments s ON s.invoice_id = i.invoice_id
    JOIN payments p ON p.invoice_id = i.invoice_id
    WHERE i.invoice_date >= DATE '2025-01-01' AND i.invoice_date < DATE '2026-01-01'
  - |-
    SELECT SUM(i.amount) AS invoiced
    FROM invoices i
    JOIN (SELECT DISTINCT invoice_id FROM shipments) s ON s.invoice_id = i.invoice_id
    JOIN (SELECT DISTINCT invoice_id FROM payments) p ON p.invoice_id = i.invoice_id
    WHERE i.invoice_date >= DATE '2025-01-01' AND i.invoice_date < DATE '2026-01-01'
# The second attempt still repeats invoice rows: DISTINCT on the amount is not a key.
q28:
  - |-
    SELECT c.segment, SUM(i.amount) AS invoiced
    FROM invoices i
    JOIN shipments s ON s.invoice_id = i.invoice_id
    JOIN customers c ON c.customer_id = i.customer_id
    WHERE i.invoice_date >= DATE '2025-01-01' AND i.invoice_date < DATE '2026-01-01'
    GROUP BY c.segment
    ORDER BY c.segment
  - |-
    SELECT c.segment, SUM(DISTINCT i.amount) AS invoiced
    FROM invoices i
    JOIN shipments s ON s.invoice_id = i.invoice_id
    JOIN customers c ON c.customer_id = i.customer_id
    WHERE i.invoice_date >= DATE '2025-01-01' AND i.invoice_date < DATE '2026-01-01'
    GROUP BY c.segment
    ORDER BY c.segment

