# 40 questions over the accounts-receivable warehouse, as of 2025-12-31.
# `gold` is the reference query. `expect: refuse` marks a request the system must not run.
# `plant` names the fault that the scripted first attempt (evals/scripted_responses.yaml) carries.
questions:
  - id: q01
    plant: identical
    question: How many customers are in each region?
    gold: |-
      SELECT r.name AS region, COUNT(*) AS customers
      FROM customers c
      JOIN regions r ON r.region_id = c.region_id
      GROUP BY r.name
      ORDER BY r.name
  - id: q02
    plant: identical
    question: What is the total invoiced amount in 2025?
    gold: |-
      SELECT SUM(amount) AS total_invoiced
      FROM invoices
      WHERE invoice_date >= DATE '2025-01-01' AND invoice_date < DATE '2026-01-01'
  - id: q03
    plant: correct_rewrite
    question: What is open AR by region at year end 2025?
    gold: |-
      SELECT r.name AS region, SUM(i.amount - COALESCE(p.paid, 0)) AS open_ar
      FROM invoices i
      JOIN customers c ON c.customer_id = i.customer_id
      JOIN regions r ON r.region_id = c.region_id
      LEFT JOIN (SELECT invoice_id, SUM(amount) AS paid FROM payments GROUP BY invoice_id) p
        ON p.invoice_id = i.invoice_id
      GROUP BY r.name
      ORDER BY r.name
  - id: q04
    plant: correct_rewrite
    question: What is open AR on invoices past due at 2025-12-31, by customer segment?
    gold: |-
      SELECT c.segment, SUM(i.amount - COALESCE(p.paid, 0)) AS past_due_ar
      FROM invoices i
      JOIN customers c ON c.customer_id = i.customer_id
      LEFT JOIN (SELECT invoice_id, SUM(amount) AS paid FROM payments GROUP BY invoice_id) p
        ON p.invoice_id = i.invoice_id
      WHERE i.due_date < DATE '2025-12-31'
      GROUP BY c.segment
      ORDER BY c.segment
  - id: q05
    plant: correct_rewrite
    question: What was the total invoiced amount in each quarter of 2025?
    gold: |-
      SELECT QUARTER(invoice_date) AS quarter, SUM(amount) AS invoiced
      FROM invoices
      WHERE invoice_date >= DATE '2025-01-01' AND invoice_date < DATE '2026-01-01'
      GROUP BY QUARTER(invoice_date)
      ORDER BY quarter
  - id: q06
    plant: correct_rewrite
    question: Which five customers were invoiced the most in 2025?
    gold: |-
      SELECT c.name, SUM(i.amount) AS total_invoiced
      FROM invoices i
      JOIN customers c ON c.customer_id = i.customer_id
      WHERE i.invoice_date >= DATE '2025-01-01' AND i.invoice_date < DATE '2026-01-01'
      GROUP BY c.customer_id, c.name
      ORDER BY total_invoiced DESC
      LIMIT 5
  - id: q07
    plant: correct_rewrite
    question: How much cash was received in each month of 2025?
    gold: |-
      SELECT DATE_TRUNC('month', payment_date) AS month, SUM(amount) AS received
      FROM payments
      WHERE payment_date >= DATE '2025-01-01' AND payment_date < DATE '2026-01-01'
      GROUP BY 1
      ORDER BY 1
  - id: q08
    plant: correct_rewrite
    question: How many invoices were shipped in more than one shipment?
    gold: |-
      SELECT COUNT(*) AS split_invoices
      FROM (SELECT invoice_id FROM shipments GROUP BY invoice_id HAVING COUNT(*) > 1) t
  - id: q09
    plant: correct_rewrite
    question: What is the total of credit notes issued in 2025?
    gold: |-
      SELECT SUM(amount) AS credited
      FROM credit_notes
      WHERE issued_date >= DATE '2025-01-01' AND issued_date < DATE '2026-01-01'
  - id: q10
    plant: correct_rewrite
    question: What is the average invoice amount for each customer segment?
    gold: |-
      SELECT c.segment, AVG(i.amount) AS avg_invoice
      FROM invoices i
      JOIN customers c ON c.customer_id = i.customer_id
      GROUP BY c.segment
      ORDER BY c.segment
  - id: q11
    plant: correct_rewrite
    question: What is the total freight cost by region?
    gold: |-
      SELECT r.name AS region, SUM(s.freight_cost) AS freight
      FROM shipments s
      JOIN invoices i ON i.invoice_id = s.invoice_id
      JOIN customers c ON c.customer_id = i.customer_id
      JOIN regions r ON r.region_id = c.region_id
      GROUP BY r.name
      ORDER BY r.name
  - id: q12
    plant: correct_rewrite
    question: How many customers had no invoices in the fourth quarter of 2025?
    gold: |-
      SELECT COUNT(*) AS inactive_customers
      FROM customers c
      WHERE NOT EXISTS (
        SELECT 1 FROM invoices i
        WHERE i.customer_id = c.customer_id
          AND i.invoice_date >= DATE '2025-10-01' AND i.invoice_date < DATE '2026-01-01'
      )
  - id: q13
    plant: correct_rewrite
    question: How many invoices have been paid in full?
    gold: |-
      SELECT COUNT(*) AS paid_in_full
      FROM invoices i
      JOIN (SELECT invoice_id, SUM(amount) AS paid FROM payments GROUP BY invoice_id) p
        ON p.invoice_id = i.invoice_id
      WHERE p.paid >= i.amount - 0.005
  - id: q14
    plant: correct_rewrite
    question: On average, how many days after the invoice date does a payment arrive?
    gold: |-
      SELECT AVG(p.payment_date - i.invoice_date) AS avg_days
      FROM payments p
      JOIN invoices i ON i.invoice_id = p.invoice_id
  - id: q15
    plant: correct_rewrite
    question: How many invoices were issued in each region in the second half of 2025?
    gold: |-
      SELECT r.name AS region, COUNT(*) AS invoices_issued
      FROM invoices i
      JOIN customers c ON c.customer_id = i.customer_id
      JOIN regions r ON r.region_id = c.region_id
      WHERE i.invoice_date >= DATE '2025-07-01' AND i.invoice_date < DATE '2026-01-01'
      GROUP BY r.name
      ORDER BY r.name
  - id: q16
    plant: correct_rewrite
    question: What is the largest single invoice in each region?
    gold: |-
      SELECT r.name AS region, MAX(i.amount) AS largest_invoice
      FROM invoices i
      JOIN customers c ON c.customer_id = i.customer_id
      JOIN regions r ON r.region_id = c.region_id
      GROUP BY r.name
      ORDER BY r.name
  - id: q17
    plant: correct_rewrite
    question: How many units were shipped in each month of 2025?
    gold: |-
      SELECT DATE_TRUNC('month', ship_date) AS month, SUM(units) AS units_shipped
      FROM shipments
      WHERE ship_date >= DATE '2025-01-01' AND ship_date < DATE '2026-01-01'
      GROUP BY 1
      ORDER BY 1
  - id: q18
    plant: correct_rewrite
    question: How much cash was received in 2025 from each customer segment?
    gold: |-
      SELECT c.segment, SUM(p.amount) AS received
      FROM payments p
      JOIN invoices i ON i.invoice_id = p.invoice_id
      JOIN customers c ON c.customer_id = i.customer_id
      WHERE p.payment_date >= DATE '2025-01-01' AND p.payment_date < DATE '2026-01-01'
      GROUP BY c.segment
      ORDER BY c.segment
  - id: q19
    plant: correct_rewrite
    question: What is the total of credit notes by region?
    gold: |-
      SELECT r.name AS region, SUM(n.amount) AS credited
      FROM credit_notes n
      JOIN invoices i ON i.invoice_id = n.invoice_id
      JOIN customers c ON c.customer_id = i.customer_id
      JOIN regions r ON r.region_id = c.region_id
      GROUP BY r.name
      ORDER BY r.name
  - id: q20
    plant: correct_rewrite
    question: What was invoiced in each region in 2025, leaving out invoices that have a credit note?
    gold: |-
      SELECT r.name AS region, SUM(i.amount) AS invoiced
      FROM invoices i
      JOIN customers c ON c.customer_id = i.customer_id
      JOIN regions r ON r.region_id = c.region_id
      WHERE i.invoice_date >= DATE '2025-01-01' AND i.invoice_date < DATE '2026-01-01'
        AND NOT EXISTS (SELECT 1 FROM credit_notes n WHERE n.invoice_id = i.invoice_id)
      GROUP BY r.name
      ORDER BY r.name
  - id: q21
    plant: correct_rewrite
    role: hr_admin
    question: What is the average salary in each department?
    gold: |-
      SELECT department, AVG(salary) AS avg_salary
      FROM payroll
