[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantrap"
version = "0.1.0"
description = "Text-to-SQL over DuckDB with sqlglot guardrails that reject fan-trap joins, scored on execution accuracy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "fantrap contributors" }]
keywords = ["text-to-sql", "duckdb", "sqlglot", "llm-evaluation", "guardrails"]
dependencies = [
    "duckdb>=1.1",
    "sqlglot>=30,<31",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
fantrap = "fantrap.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fantrap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: calls a real model endpoint; runs only when FANTRAP_LIVE=1"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
