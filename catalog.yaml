# Semantic catalog for the accounts-receivable warehouse.
# Cardinality is written parent-to-child: "1:N" means one parent row, many child rows.
tables:
  regions:
    description: Sales regions.
    primary_key: [region_id]
    columns:
      region_id: INTEGER
      name: VARCHAR
  customers:
    description: Wholesale customers.
    primary_key: [customer_id]
    columns:
      customer_id: INTEGER
      name: VARCHAR
      region_id: INTEGER
      segment: VARCHAR
      terms_days: INTEGER
      tax_id: VARCHAR
  invoices:
    description: One row per invoice. amount is the invoiced total, due_date is invoice_date plus the customer's terms.
    primary_key: [invoice_id]
    columns:
      invoice_id: INTEGER
      customer_id: INTEGER
      invoice_date: DATE
      due_date: DATE
      amount: DOUBLE
  shipments:
    description: Shipments for an invoice. An invoice can ship in several partial shipments.
    primary_key: [shipment_id]
    columns:
      shipment_id: INTEGER
      invoice_id: INTEGER
      ship_date: DATE
      units: INTEGER
      freight_cost: DOUBLE
  payments:
    description: Cash received against an invoice. An invoice can be paid in several installments or only in part.
    primary_key: [payment_id]
    columns:
      payment_id: INTEGER
      invoice_id: INTEGER
      payment_date: DATE
      amount: DOUBLE
  credit_notes:
    description: Credits issued against an invoice.
    primary_key: [credit_note_id]
    columns:
      credit_note_id: INTEGER
      invoice_id: INTEGER
      issued_date: DATE
      amount: DOUBLE
  payroll:
    description: Employee salaries. HR only.
    primary_key: [employee_id]
    columns:
      employee_id: INTEGER
      department: VARCHAR
      region_id: INTEGER
      salary: DOUBLE

relationships:
  - { parent: regions.region_id, child: customers.region_id, cardinality: "1:N" }
  - { parent: customers.customer_id, child: invoices.customer_id, cardinality: "1:N" }
  - { parent: invoices.invoice_id, child: shipments.invoice_id, cardinality: "1:N" }
  - { parent: invoices.invoice_id, child: payments.invoice_id, cardinality: "1:N" }
  - { parent: invoices.invoice_id, child: credit_notes.invoice_id, cardinality: "1:N" }
  - { parent: regions.region_id, child: payroll.region_id, cardinality: "1:N" }

# Columns that are summed or averaged. A measure repeated by a join is the classic silent error.
measures:
  invoices: [amount]
  payments: [amount]
  credit_notes: [amount]
  shipments: [units, freight_cost]
  payroll: [salary]

roles:
  analyst:
    description: Finance analyst. No payroll, no customer tax ids.
    allow_tables: [regions, customers, invoices, shipments, payments, credit_notes]
    deny_columns: [customers.tax_id]
  hr_admin:
    description: HR administrator. Payroll and regions only.
    allow_tables: [payroll, regions]
    deny_columns: []
